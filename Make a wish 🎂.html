<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Make a wish 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff0f4; --bg2:#ffd9e5; --ink:#3b1b35; --muted:#7d5a74;
  --rose:#e5486f; --rose2:#ff8fab; --amber:#f59e0b; --paper:#ffffff; --line:#f1c6d5;
  --plate:#e8d5de; --frost:#fff6f9; --sponge:#f6b8c9;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1a0f24; --bg2:#2b1638; --ink:#ffeef5; --muted:#c9a6bd;
    --rose:#ff7a9c; --rose2:#ff9fb8; --amber:#ffc24d; --paper:#2a1836; --line:#4a2c5a;
    --plate:#4a3358; --frost:#ffe9f1; --sponge:#e98fae; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1a0f24; --bg2:#2b1638; --ink:#ffeef5; --muted:#c9a6bd;
  --rose:#ff7a9c; --rose2:#ff9fb8; --amber:#ffc24d; --paper:#2a1836; --line:#4a2c5a;
  --plate:#4a3358; --frost:#ffe9f1; --sponge:#e98fae; color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--ink);
  background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 70%) var(--bg);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;
}
main{width:100%;max-width:34rem;padding:2.5rem 1.25rem 4rem;text-align:center}
h1{font-size:clamp(2rem,9vw,3.1rem);line-height:1.05;margin:0 0 .6rem;font-weight:800;letter-spacing:-.02em}
.sub{margin:0 auto;max-width:26rem;color:var(--muted);font-size:1.05rem;line-height:1.5;min-height:3em}
.stage{margin:1.5rem auto 0;width:min(100%,21rem)}
svg{display:block;width:100%;height:auto;overflow:visible}
.flame{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate;transition:opacity .35s,transform .35s}
.flame:focus-visible{outline:none}
.flame:focus-visible .glow{stroke:var(--ink);stroke-width:2}
.flame.out{opacity:0;transform:scale(.2) translateY(-8px);animation:none;pointer-events:none}
.glow{fill:var(--amber);opacity:.28}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.92,1.08) rotate(3deg)}}
.smoke{opacity:0;transition:opacity .3s}
.smoke.on{animation:rise 1.4s ease-out forwards}
@keyframes rise{0%{opacity:.6;transform:translateY(0)}100%{opacity:0;transform:translateY(-26px)}}
.hint{margin-top:1rem;font-size:.95rem;color:var(--muted)}
.btn{
  font:inherit;font-weight:800;border:0;border-radius:999px;padding:.85rem 1.6rem;cursor:pointer;
  background:var(--rose);color:#fff;font-size:1.05rem;box-shadow:0 6px 0 color-mix(in srgb,var(--rose) 60%,#000);
  transition:transform .12s,box-shadow .12s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--rose) 60%,#000)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;font-weight:500;font-size:.95rem;text-decoration:underline}
#after{margin-top:2rem}
#after[hidden],.letter[hidden]{display:none}
.letter{
  margin:2rem auto 0;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:6px 6px 18px 18px;padding:1.6rem 1.5rem 1.8rem;max-width:30rem;
  font-family:"Caveat","Bradley Hand",cursive;font-size:1.5rem;line-height:1.45;
  transform-origin:50% 0;animation:unfold .7s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 18px 40px -20px color-mix(in srgb,var(--rose) 70%,transparent);
}
.letter p{margin:.2rem 0 .9rem}
.letter .to{font-weight:700;font-size:1.8rem;color:var(--rose)}
.letter .from{margin-top:1.2rem;text-align:right;font-weight:700}
@keyframes unfold{from{opacity:0;transform:perspective(600px) rotateX(-50deg) scaleY(.4)}to{opacity:1;transform:none}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.lantern{position:fixed;bottom:-70px;width:34px;height:44px;border-radius:12px 12px 8px 8px;z-index:4;pointer-events:none;
  background:linear-gradient(var(--amber),var(--rose2));box-shadow:0 0 24px 6px color-mix(in srgb,var(--amber) 55%,transparent);
  opacity:0;animation:floatup linear forwards}
@keyframes floatup{0%{opacity:0;transform:translate(0,0)}10%{opacity:.95}100%{opacity:0;transform:translate(var(--dx),-120vh)}}
.lyric{min-height:2.2rem;margin:.2rem 0 1rem;font-family:"Caveat","Bradley Hand",cursive;font-size:1.7rem;color:var(--rose)}
.meter{height:.5rem;width:10rem;margin:.6rem auto 0;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--amber);transition:width .08s}
.meter[hidden]{display:none}
@media (prefers-reduced-motion:reduce){
  .flame{animation:none}.letter{animation:none}.smoke.on{animation:none}
}
</style>
</head>
<body>
<main>
  <h1 id="title">Make a wish.</h1>
  <p class="sub" id="sub">Tap each flame to blow out the candles.</p>

  <div class="stage">
    <svg viewBox="0 0 300 270" role="img" aria-label="Birthday cake with three lit candles">
      <ellipse cx="150" cy="248" rx="140" ry="14" fill="var(--plate)"/>
      <!-- bottom tier -->
      <rect x="40" y="178" width="220" height="68" rx="14" fill="var(--sponge)"/>
      <path d="M40 192c18 14 30-6 46 6s30-8 48 6 32-8 50 6 30-8 48 4 26-6 28-4v-14a14 14 0 0 0-14-14H54a14 14 0 0 0-14 14z" fill="var(--frost)"/>
      <circle cx="80" cy="222" r="5" fill="var(--rose)"/><circle cx="125" cy="228" r="5" fill="var(--amber)"/>
      <circle cx="175" cy="222" r="5" fill="var(--rose)"/><circle cx="220" cy="228" r="5" fill="var(--amber)"/>
      <!-- top tier -->
      <rect x="78" y="120" width="144" height="62" rx="12" fill="var(--rose2)"/>
      <path d="M78 134c14 12 24-4 38 6s24-8 38 6 24-8 36 4 22-6 32-2v-10a12 12 0 0 0-12-12H90a12 12 0 0 0-12 12z" fill="var(--frost)"/>
      <!-- candles -->
      <g id="candles"></g>
    </svg>
  </div>
  <p class="hint" id="hint">3 candles left</p>
  <p><button class="btn" id="mic" type="button">Blow into your phone</button></p>
  <div class="meter" id="meter" hidden><i id="level"></i></div>
  <p class="hint" id="micmsg"></p>

  <section id="after" hidden>
    <p class="lyric" id="lyric" aria-live="polite"></p>
    <button class="btn" id="open">Open your letter</button>
    <p><button class="btn ghost" id="song" type="button">Play the song again</button></p>
    <div class="letter" id="letter" hidden></div>
    <p><button class="btn ghost" id="again">Light the candles again</button></p>
  </section>
</main>
<canvas id="confetti"></canvas>

<script>
/* ---- Edit these ---- */
var CONFIG = {
  name: "Beautiful Girl :3",          // or open this page's link ending in #Sarah to set the name
  from: "Your Good Boy :)",
  candles: 3,
  letter: [
    "i hope this new chapter of your life brings u lots of happiness, good health, and everything you've been wishing for. i'm so grateful to have u in my life. we've been through so much together, and after more than two years, i'm still happy to have u by my side. thank u for staying, loving me, and being part of my life.",
    "i really wish i could be there to celebrate with u, give u a big hug, and spend this special day together. hopefully someday we won't have to celebrate through a screen anymore.",
    "please always take care of yourself and keep smiling. i love u so much, and i hope we get to celebrate many more birthdays together. happy birthday once again, my love!! 💙💜"
  ]
};
/* -------------------- */

(function(){
  var h = ""; try{ h = decodeURIComponent(location.hash.slice(1)); }catch(e){}
  var name = /^[A-Za-z]{1,24}$/.test(h) ? h.charAt(0).toUpperCase()+h.slice(1) : CONFIG.name;
  var title = document.getElementById("title"), sub = document.getElementById("sub");
  var hint = document.getElementById("hint"), after = document.getElementById("after");
  var gCandles = document.getElementById("candles");
  var left = 0, NS = "http://www.w3.org/2000/svg";
  var colors = ["#ff7a9c","#ffc24d","#7cdcc0","#8ab4ff","#c79bff","#ffffff"];

  function el(tag, attrs, parent){
    var n = document.createElementNS(NS, tag);
    for(var k in attrs) n.setAttribute(k, attrs[k]);
    if(parent) parent.appendChild(n);
    return n;
  }

  function build(){
    gCandles.innerHTML = ""; left = CONFIG.candles;
    var n = CONFIG.candles, span = 90, start = 150 - span/2;
    for(var i=0;i<n;i++){
      var x = n===1 ? 150 : start + i*(span/(n-1));
      var stripe = ["var(--rose)","var(--amber)","var(--rose2)"][i%3];
      el("rect",{x:x-5,y:76,width:10,height:48,rx:3,fill:stripe},gCandles);
      el("rect",{x:x-5,y:88,width:10,height:6,fill:"#fff",opacity:".55"},gCandles);
      el("rect",{x:x-5,y:102,width:10,height:6,fill:"#fff",opacity:".55"},gCandles);
      var smoke = el("path",{"class":"smoke",d:"M"+x+" 70c-6-8 6-12 0-20",stroke:"var(--muted)","stroke-width":3,fill:"none","stroke-linecap":"round"},gCandles);
      var f = el("g",{"class":"flame",tabindex:0,role:"button","aria-label":"Blow out candle "+(i+1)},gCandles);
      el("circle",{"class":"glow",cx:x,cy:58,r:19},f);
      el("path",{d:"M"+x+" 76c-9 0-11-10-6-18 3-5 5-8 6-14 7 8 12 14 12 21 0 6-5 11-12 11z",fill:"var(--amber)"},f);
      el("path",{d:"M"+x+" 76c-4 0-6-4-4-8 1-2 3-4 4-7 4 4 6 7 6 10 0 3-3 5-6 5z",fill:"#fff4c2"},f);
      (function(flame, smk){
        function blow(){
          if(flame.classList.contains("out")) return;
          flame.classList.add("out"); smk.classList.add("on");
          left--; update();
        }
        flame.addEventListener("click", blow);
        flame.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); blow(); }});
      })(f, smoke);
    }
    title.textContent = "Make a wish, " + name + ".";
    sub.textContent = "Close your eyes, think of something good, then tap each flame to blow out the candles.";
    after.hidden = true; document.getElementById("letter").hidden = true;
    document.getElementById("open").hidden = false;
    resetMic(); stopSong();
    update();
  }

  function update(){
    if(left > 0){
      hint.textContent = left + (left===1 ? " candle left" : " candles left");
    } else {
      hint.textContent = "";
      title.textContent = "Happy birthday, " + name + "!";
      sub.textContent = "Your wish is on its way. I have one more thing for you.";
      after.hidden = false; burst(); lanterns(); stopMic(); playSong();
    }
  }

  document.getElementById("open").addEventListener("click", function(){
    var box = document.getElementById("letter");
    var html = '<p class="to">Dear ' + name + ',</p>';
    CONFIG.letter.forEach(function(t){ html += "<p></p>"; });
    box.innerHTML = html;
    var ps = box.querySelectorAll("p");
    CONFIG.letter.forEach(function(t,i){ ps[i+1].textContent = t; });
    var sig = document.createElement("p"); sig.className = "from"; sig.textContent = "Love, " + CONFIG.from;
    box.appendChild(sig);
    box.hidden = false; this.hidden = true;
    box.scrollIntoView({behavior:"smooth",block:"center"});
    burst(60);
  });
  document.getElementById("again").addEventListener("click", function(){
    build(); window.scrollTo({top:0,behavior:"smooth"});
  });

  /* confetti */
  var cv = document.getElementById("confetti"), ctx = cv.getContext("2d"), parts = [], raf = 0;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){ cv.width = innerWidth; cv.height = innerHeight; }
  addEventListener("resize", size); size();
  function burst(n){
    n = reduce ? 30 : (n || 160);
    for(var i=0;i<n;i++){
      var a = Math.random()*Math.PI*2, s = 5 + Math.random()*9;
      parts.push({x:cv.width/2,y:cv.height*0.42,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,
        w:6+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,
        c:colors[(Math.random()*colors.length)|0],life:0});
    }
    if(!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    parts = parts.filter(function(p){ return p.y < cv.height+20 && p.life < 260; });
    parts.forEach(function(p){
      p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    raf = parts.length ? requestAnimationFrame(tick) : 0;
  }

  /* birthday song: the traditional melody, played with the Web Audio API */
  var songCtx = null, songTimers = [], songOn = false, BEAT = 0.5;
  var lyricEl = document.getElementById("lyric"), songBtn = document.getElementById("song");
  var SONG = [
    {t:"Happy birthday to you,", n:[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2]]},
    {t:"Happy birthday to you,", n:[[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2]]},
    {t:"Happy birthday, dear NAME,", n:[[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1]]},
    {t:"Happy birthday to you!", n:[[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]]}
  ];
  function stopSong(){
    songTimers.forEach(clearTimeout); songTimers = [];
    if(songCtx){ try{ songCtx.close(); }catch(e){} songCtx = null; }
    songOn = false; lyricEl.textContent = ""; songBtn.textContent = "Play the song again";
  }
  function playSong(){
    stopSong();
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    var c; try{ c = new AC(); }catch(e){ return; }
    songCtx = c; if(c.resume) c.resume();
    var t = c.currentTime + 0.2;
    songOn = true; songBtn.textContent = "Stop the song";
    SONG.forEach(function(line){
      var at = (t - c.currentTime) * 1000;
      songTimers.push(setTimeout(function(){ lyricEl.textContent = line.t.replace("NAME", name); }, at));
      line.n.forEach(function(nt){
        var o = c.createOscillator(), g = c.createGain(), d = nt[1] * BEAT;
        o.type = "triangle"; o.frequency.value = nt[0];
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d * 0.95);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d);
        t += d;
      });
    });
    songTimers.push(setTimeout(stopSong, (t - c.currentTime) * 1000 + 500));
  }
  songBtn.addEventListener("click", function(){ if(songOn) stopSong(); else playSong(); });

  /* blow into the microphone (tapping the flames always works too) */
  var stream = null, ctxA = null, timer = 0, loud = 0, cooldown = 0;
  var micBtn = document.getElementById("mic"), meter = document.getElementById("meter");
  var level = document.getElementById("level"), micmsg = document.getElementById("micmsg");

  function stopMic(){
    clearInterval(timer); timer = 0;
    if(stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if(ctxA){ try{ ctxA.close(); }catch(e){} ctxA = null; }
    meter.hidden = true; micBtn.hidden = true; micmsg.textContent = "";
  }
  function resetMic(){ stopMic(); micBtn.hidden = false; }

  micBtn.addEventListener("click", function(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micmsg.textContent = "Your browser can’t use the microphone here. Just tap the flames."; return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
      stream = s;
      var AC = window.AudioContext || window.webkitAudioContext;
      ctxA = new AC();
      var src = ctxA.createMediaStreamSource(s), an = ctxA.createAnalyser();
      an.fftSize = 512; src.connect(an);
      var buf = new Uint8Array(an.fftSize);
      micBtn.hidden = true; meter.hidden = false;
      micmsg.textContent = "Take a breath and blow toward the screen.";
      timer = setInterval(function(){
        an.getByteTimeDomainData(buf);
        var sum = 0; for(var k=0;k<buf.length;k++){ var v = (buf[k]-128)/128; sum += v*v; }
        var rms = Math.sqrt(sum/buf.length);
        level.style.width = Math.min(100, rms*400) + "%";
        loud = rms > 0.12 ? loud + 1 : 0;
        if(cooldown > 0) cooldown--;
        if(loud >= 3 && cooldown === 0){
          var lit = document.querySelector(".flame:not(.out)");
          if(lit){ lit.dispatchEvent(new Event("click")); cooldown = 6; }
        }
      }, 60);
    }).catch(function(){
      micmsg.textContent = "Microphone is off. No problem, just tap the flames.";
    });
  });

  /* wish lanterns */
  function lanterns(){
    if(reduce) return;
    for(var k=0;k<14;k++){
      var d = document.createElement("div");
      d.className = "lantern";
      d.style.left = (4 + Math.random()*90) + "%";
      d.style.setProperty("--dx", (Math.random()*80-40) + "px");
      d.style.animationDuration = (7 + Math.random()*6) + "s";
      d.style.animationDelay = (Math.random()*2.5) + "s";
      d.style.transform = "scale(" + (.7 + Math.random()*.7) + ")";
      d.addEventListener("animationend", function(){ this.remove(); });
      document.body.appendChild(d);
    }
  }

  addEventListener("hashchange", function(){ location.reload(); });
  build();
})();
</script>
</body>
</html>
